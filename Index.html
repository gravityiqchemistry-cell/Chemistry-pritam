<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Header -->

        <div class="max-w-4xl mx-auto px-4 py-6 text-center">

            <p class="text-indigo-200 mt-1">MHT-CET Concept-Oriented Practice Test (Easy Level - 30 Questions)</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Student Info Screen -->
        <div id="setup-screen" class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <h2 class="text-xl font-semibold text-slate-700 mb-4 border-b pb-2">Student Information</h2>
            <form id="student-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                    <input type="text" id="student-name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Enter your name">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Roll Number</label>
                    <input type="text" id="student-roll" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Enter your roll number">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors shadow">
                    Start Test
                </button>
            </form>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden space-y-6">
            <!-- Student Banner -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4 flex justify-between items-center text-sm font-medium text-indigo-900">
                <span>Student: <strong id="display-name"></strong></span>
                <span>Roll No: <strong id="display-roll"></strong></span>
            </div>

            <form id="quiz-form" class="space-y-6">
                <div id="questions-container" class="space-y-6">
                    <!-- Dynamic Questions Inserted Here -->
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition-colors shadow">
                    Submit Test & View Results
                </button>
            </form>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-white rounded-xl shadow-lg p-6 md:p-8 space-y-6">
            <div class="text-center border-b pb-6">
                <h2 class="text-2xl font-bold text-slate-800">Test Submitted Successfully!</h2>
                <p class="text-slate-600 mt-1">Here is your performance summary</p>
                <div class="mt-4 inline-block bg-indigo-50 border border-indigo-200 px-6 py-3 rounded-xl">
                    <span class="text-sm text-indigo-600 block font-medium">Your Score</span>
                    <span id="score-display" class="text-3xl font-extrabold text-indigo-700">0 / 30</span>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-bold text-slate-700 mb-4">Detailed Answer Key & Explanations</h3>
                <div id="answer-key-container" class="space-y-4">
                    <!-- Dynamic Answer Key Inserted Here -->
                </div>
            </div>
        </div>
    </main>

        const setupScreen = document.getElementById('setup-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const studentForm = document.getElementById('student-form');
        const quizForm = document.getElementById('quiz-form');
        const questionsContainer = document.getElementById('questions-container');
        const answerKeyContainer = document.getElementById('answer-key-container');

        let studentInfo = { name: '', roll: '' };

        // Render Questions
        function renderQuestions() {
            questionsContainer.innerHTML = '';
            questionsData.forEach((q, index) => {
                let optionsHtml = '';
                // Shuffle options visually or keep ordered; here we render them clearly
                q.options.forEach((opt, optIdx) => {
                    optionsHtml += `
                        <label class="flex items-center space-x-3 p-3 border rounded-lg hover:bg-slate-50 cursor-pointer transition-colors">
                            <input type="radio" name="q${q.id}" value="${optIdx}" required class="text-indigo-600 focus:ring-indigo-500">
                            <span class="text-slate-700">${opt.text}</span>
                        </label>
                    `;
                });

                questionsContainer.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
                        <div class="flex justify-between items-center text-xs font-semibold text-indigo-600 uppercase tracking-wider">
                            <span>Question ${index + 1} of 30</span>
                            <span class="bg-indigo-50 px-2.5 py-1 rounded-full">${q.chapter}</span>
                        </div>
                        <p class="text-base font-medium text-slate-800">${q.question}</p>
                        <div class="space-y-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
            if (window.MathJax) {
                window.MathJax.typeset();
            }
        }

        studentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            studentInfo.name = document.getElementById('student-name').value.trim();
            studentInfo.roll = document.getElementById('student-roll').value.trim();

            document.getElementById('display-name').textContent = studentInfo.name;
            document.getElementById('display-roll').textContent = studentInfo.roll;

            setupScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let score = 0;
            let answerKeyHtml = '';

            questionsData.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${q.id}"]:checked`);
                const selectedVal = selectedOption ? parseInt(selectedOption.value) : -1;
                const correctOptObj = q.options.find(o => o.correct);
                const correctIdx = q.options.indexOf(correctOptObj);
                const isCorrect = selectedVal === correctIdx;

                if (isCorrect) score++;

                const userAnsText = selectedVal !== -1 ? q.options[selectedVal].text : "Not Attempted";
                const badgeClass = isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
                const badgeText = isCorrect ? 'Correct' : 'Incorrect';

                answerKeyHtml += `
                    <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="text-sm font-semibold text-slate-700">Q${index + 1}. ${q.question}</span>
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="text-sm text-slate-600">
                            <p><strong>Your Answer:</strong> ${userAnsText}</p>
                            <p><strong>Correct Answer:</strong> ${correctOptObj.text}</p>
                        </div>
                        <div class="bg-white p-3 rounded border border-slate-100 text-xs text-slate-700 mt-2">
                            <strong>Explanation:</strong> ${q.explanation}
                        </div>
                    </div>
                `;
            });

            document.getElementById('score-display').textContent = `${score} / 30`;
            answerKeyContainer.innerHTML = answerKeyHtml;

            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (window.MathJax) {
                window.MathJax.typeset();
            }
        });
    </script>
</body>
</html>
